<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0010;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d0020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050015;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(180,0,255,0.07)" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(180,0,255,0.03)"/>
    </pattern>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="50%" style="stop-color:#bf00ff"/>
      <stop offset="100%" style="stop-color:#ff00cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="160" fill="url(#bgGrad)"/>
  <rect width="1200" height="160" fill="url(#grid)"/>
  <rect width="1200" height="160" fill="url(#scanlines)"/>

  <!-- Top perspective grid lines -->
  <g opacity="0.2" filter="url(#neonGlow)">
    <line x1="600" y1="0" x2="0" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="150" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="300" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="450" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="600" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="750" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="900" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="1050" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="1200" y2="60" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#bf00ff" stroke-width="0.3"/>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#bf00ff" stroke-width="0.25"/>
  </g>

  <!-- Border lines -->
  <line x1="0" y1="0" x2="0" y2="160" stroke="#ff00ff" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
  <line x1="1200" y1="0" x2="1200" y2="160" stroke="#ff00ff" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
  <line x1="0" y1="159" x2="1200" y2="159" stroke="#bf00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.6"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#bf00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Corner brackets -->
  <g filter="url(#neonGlow)" stroke="#ff00ff" stroke-width="2" fill="none" opacity="0.9">
    <polyline points="15,15 15,45 45,45" />
    <polyline points="1185,15 1185,45 1155,45" />
    <polyline points="15,145 15,115 45,115" />
    <polyline points="1185,145 1185,115 1155,115" />
  </g>

  <!-- Circuit traces left -->
  <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.3" filter="url(#neonGlow)">
    <path d="M 70 40 L 110 40 L 110 80 L 140 80"/>
    <circle cx="70" cy="40" r="2.5" fill="#00ffff"/>
    <circle cx="140" cy="80" r="2.5" fill="#00ffff"/>
  </g>
  <!-- Circuit traces right -->
  <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.3" filter="url(#neonGlow)">
    <path d="M 1130 40 L 1090 40 L 1090 80 L 1060 80"/>
    <circle cx="1130" cy="40" r="2.5" fill="#00ffff"/>
    <circle cx="1060" cy="80" r="2.5" fill="#00ffff"/>
  </g>

  <!-- Glitch shadow layer -->
  <text x="600" y="100" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="900"
    fill="#00ffff" text-anchor="middle" opacity="0.2" dx="2" dy="2">BUILDING ⚡ GROWING</text>
  <!-- Main text -->
  <text x="600" y="100" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="900"
    fill="url(#neonText)" text-anchor="middle" filter="url(#titleGlow)">BUILDING ⚡ GROWING</text>

  <!-- Subtext -->
  <text x="600" y="128" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400"
    fill="#ff80ff" text-anchor="middle" letter-spacing="5" opacity="0.8">• KayK • kay7k4-ai •</text>

  <!-- Small tech dots -->
  <g fill="#ff00ff" opacity="0.5" filter="url(#neonGlow)">
    <circle cx="220" cy="25" r="1.5"/>
    <circle cx="380" cy="18" r="1"/>
    <circle cx="820" cy="25" r="1.5"/>
    <circle cx="980" cy="18" r="1"/>
  </g>
  <!-- Corner tech text -->
  <text x="60" y="148" font-family="'Courier New', monospace" font-size="8" fill="#ff00ff" opacity="0.4" letter-spacing="2">SYS::EOF</text>
  <text x="1020" y="148" font-family="'Courier New', monospace" font-size="8" fill="#00ffff" opacity="0.4" letter-spacing="2">SESSION::END</text>
</svg>
