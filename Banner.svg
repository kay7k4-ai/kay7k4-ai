<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Deep dark cyberpunk background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0010;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d0020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050015;stop-opacity:1" />
    </linearGradient>
    <!-- Neon glow filter - magenta/purple -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Strong title glow -->
    <filter id="titleGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(180,0,255,0.04)"/>
    </pattern>
    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(180,0,255,0.08)" stroke-width="0.5"/>
    </pattern>
    <!-- Magenta neon gradient for text -->
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="50%" style="stop-color:#bf00ff"/>
      <stop offset="100%" style="stop-color:#ff00cc"/>
    </linearGradient>
    <!-- Cyan accent gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="100%" style="stop-color:#00bfff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- Scanlines overlay -->
  <rect width="1200" height="300" fill="url(#scanlines)"/>

  <!-- Perspective grid lines bottom (cyberpunk floor effect) -->
  <g opacity="0.25" filter="url(#neonGlow)">
    <line x1="600" y1="300" x2="0" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="120" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="240" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="360" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="480" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="600" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="720" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="840" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="960" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="1080" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <line x1="600" y1="300" x2="1200" y2="210" stroke="#bf00ff" stroke-width="0.6"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#bf00ff" stroke-width="0.4"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#bf00ff" stroke-width="0.3"/>
    <line x1="0" y1="275" x2="1200" y2="275" stroke="#bf00ff" stroke-width="0.25"/>
    <line x1="0" y1="287" x2="1200" y2="287" stroke="#bf00ff" stroke-width="0.2"/>
  </g>

  <!-- Decorative corner brackets - top left -->
  <g filter="url(#neonGlow)" stroke="#ff00ff" stroke-width="2" fill="none" opacity="0.9">
    <polyline points="20,20 20,60 60,60" />
    <polyline points="1180,20 1180,60 1140,60" />
    <polyline points="20,280 20,240 60,240" />
    <polyline points="1180,280 1180,240 1140,240" />
  </g>

  <!-- Side accent lines -->
  <line x1="0" y1="0" x2="0" y2="300" stroke="#ff00ff" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
  <line x1="1200" y1="0" x2="1200" y2="300" stroke="#ff00ff" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#bf00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Circuit trace decorations left -->
  <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.35" filter="url(#neonGlow)">
    <path d="M 80 80 L 130 80 L 130 120 L 160 120"/>
    <circle cx="80" cy="80" r="3" fill="#00ffff"/>
    <circle cx="160" cy="120" r="3" fill="#00ffff"/>
    <path d="M 50 150 L 100 150 L 100 180 L 80 180 L 80 210"/>
    <circle cx="50" cy="150" r="2" fill="#00ffff"/>
  </g>

  <!-- Circuit trace decorations right -->
  <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.35" filter="url(#neonGlow)">
    <path d="M 1120 80 L 1070 80 L 1070 120 L 1040 120"/>
    <circle cx="1120" cy="80" r="3" fill="#00ffff"/>
    <circle cx="1040" cy="120" r="3" fill="#00ffff"/>
    <path d="M 1150 150 L 1100 150 L 1100 180 L 1120 180 L 1120 210"/>
    <circle cx="1150" cy="150" r="2" fill="#00ffff"/>
  </g>

  <!-- Small decorative dots scattered -->
  <g fill="#ff00ff" opacity="0.6" filter="url(#neonGlow)">
    <circle cx="200" cy="45" r="2"/>
    <circle cx="350" cy="30" r="1.5"/>
    <circle cx="900" cy="45" r="2"/>
    <circle cx="980" cy="30" r="1.5"/>
    <circle cx="450" cy="260" r="1.5"/>
    <circle cx="750" cy="270" r="2"/>
  </g>

  <!-- Main name - KARIMA with glitch layer -->
  <!-- Shadow/glitch layer offset -->
  <text x="600" y="138" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="900"
    fill="#00ffff" text-anchor="middle" opacity="0.25" dx="3" dy="3">KARIMA KHATUN</text>
  <!-- Main text -->
  <text x="600" y="138" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="900"
    fill="url(#neonText)" text-anchor="middle" filter="url(#titleGlow)">KARIMA KHATUN</text>


  <!-- Tagline -->
  <text x="600" y="185" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="400"
    fill="#ff80ff" text-anchor="middle" letter-spacing="4" opacity="0.85">OPEN-SOURCE  ·  FULL STACK  ·  DSA  ·  MACHINE-LEARNING  ·  DBMS  ·  DATA SCIENCE</text>

  <!-- Bottom horizontal accent line -->
  <line x1="200" y1="225" x2="1000" y2="225" stroke="#bf00ff" stroke-width="1" filter="url(#neonGlow)" opacity="0.5"/>
  <!-- Short center accent -->
  <line x1="480" y1="225" x2="720" y2="225" stroke="#ff00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.9"/>

  <!-- Decorative small tech elements bottom -->
  <text x="120" y="260" font-family="'Courier New', monospace" font-size="9" fill="#ff00ff" opacity="0.5" letter-spacing="2">SYS_BOOT::COMPLETE</text>
  <text x="920" y="260" font-family="'Courier New', monospace" font-size="9" fill="#00ffff" opacity="0.5" letter-spacing="2">ACCESS::GRANTED</text>
</svg>
